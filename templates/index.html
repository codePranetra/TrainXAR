<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Milo Chat Bot</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    @import "https://unpkg.com/open-props/easings.min.css";

    :root {
      --bg-color: #f0f2f5;
      --container-bg: #ffffff;
      --text-color: #333;
      --bot-bg: #f1f0f0;
      --user-bg: #007aff;
      --input-bg: #fff;
      --border-color: #ddd;
      --icon-fill: #333;
      --icon-fill-hover: #007aff;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --container-bg: #1e1e1e;
      --text-color: #f0f0f0;
      --bot-bg: #2c2c2c;
      --user-bg: #007aff;
      --input-bg: #2c2c2c;
      --border-color: #333;
      --icon-fill: #f0f0f0;
      --icon-fill-hover: #007aff;
    }

    body {
      background: var(--bg-color);
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      transition: background 0.3s;
    }

    .container {
      background: var(--container-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
      color: var(--text-color);
      transition: background 0.3s, color 0.3s;
      position: relative;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--container-bg);
      padding: 18px 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-color);
    }

    .theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-color);
    }

    .sun-and-moon > :is(.moon, .sun, .sun-beams) {
      transform-origin: center;
    }

    .sun-and-moon > :is(.moon, .sun) {
      fill: var(--icon-fill);
    }

    .theme-toggle:is(:hover, :focus-visible) > .sun-and-moon > :is(.moon, .sun) {
      fill: var(--icon-fill-hover);
    }

    .sun-and-moon > .sun-beams {
      stroke: var(--icon-fill);
      stroke-width: 2px;
    }

    .theme-toggle:is(:hover, :focus-visible) .sun-and-moon > .sun-beams {
      stroke: var(--icon-fill-hover);
    }

    [data-theme="dark"] .sun-and-moon > .sun {
      transform: scale(1.75);
    }

    [data-theme="dark"] .sun-and-moon > .sun-beams {
      opacity: 0;
    }

    [data-theme="dark"] .sun-and-moon > .moon > circle {
      transform: translateX(-7px);
    }

    @supports (cx: 1) {
      [data-theme="dark"] .sun-and-moon > .moon > circle {
        cx: 17;
        transform: translateX(0);
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .sun-and-moon > .sun {
        transition: transform .5s var(--ease-elastic-3);
      }

      .sun-and-moon > .sun-beams {
        transition: transform .5s var(--ease-elastic-4), opacity .5s var(--ease-3);
      }

      .sun-and-moon .moon > circle {
        transition: transform .25s var(--ease-out-5);
      }

      @supports (cx: 1) {
        .sun-and-moon .moon > circle {
          transition: cx .25s var(--ease-out-5);
        }
      }

      [data-theme="dark"] .sun-and-moon > .sun {
        transition-timing-function: var(--ease-3);
        transition-duration: .25s;
      }

      [data-theme="dark"] .sun-and-moon > .sun-beams {
        transition-duration: .15s;
        transform: rotateZ(-25deg);
      }

      [data-theme="dark"] .sun-and-moon > .moon > circle {
        transition-duration: .5s;
        transition-delay: .25s;
      }
    }

    .chat-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .chat-message {
      max-width: 75%;
      padding: 12px 16px;
      margin: 8px 0;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 14px;
      word-wrap: break-word;
    }

    .user-message {
      background: var(--user-bg);
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .bot-message {
      background: var(--bot-bg);
      color: var(--text-color);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .input-container {
      display: flex;
      border-top: 1px solid var(--border-color);
      padding: 12px;
      background: var(--container-bg);
      transition: background 0.3s;
    }

    .input-container input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      font-size: 14px;
      outline: none;
      background: var(--input-bg);
      color: var(--text-color);
      transition: background 0.3s, color 0.3s;
    }

    .input-container input:focus {
      border-color: #007aff;
    }

    .input-container button {
      background: #007aff;
      color: #fff;
      border: none;
      padding: 10px 20px;
      margin-left: 10px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-container button:hover {
      background: #005bb5;
    }

    .spinner {
      text-align: center;
      font-size: 14px;
      color: #007aff;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- ✅ New flex header for alignment -->
    <div class="header">
      <h1>Milo Chat Bot</h1>
      <button class="theme-toggle" id="theme-toggle" title="Toggle theme" aria-label="auto" aria-live="polite">
        <svg class="sun-and-moon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24">
          <mask class="moon" id="moon-mask">
            <rect x="0" y="0" width="100%" height="100%" fill="white" />
            <circle cx="24" cy="10" r="6" fill="black" />
          </mask>
          <circle class="sun" cx="12" cy="12" r="6" mask="url(#moon-mask)" fill="currentColor" />
          <g class="sun-beams" stroke="currentColor">
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </g>
        </svg>
      </button>
    </div>

    <div class="chat-container" id="chatContainer">
      {% for turn in history %}
        <div class="chat-message user-message">{{ turn.query }}</div>
        <div class="chat-message bot-message">{{ turn.answer }}</div>
      {% endfor %}
    </div>
    <div class="spinner" id="spinner" style="display:none;">Thinking...</div>
    <div class="input-container">
      <input type="text" id="queryInput" placeholder="Type your message..." onkeypress="if(event.key === 'Enter') submitQuery();" />
      <button onclick="submitQuery()">Send</button>
    </div>
  </div>

  <script>
    const storageKey = 'theme-preference'

    const onClick = () => {
      theme.value = theme.value === 'light' ? 'dark' : 'light'
      setPreference()
    }

    const getColorPreference = () => {
      if (localStorage.getItem(storageKey))
        return localStorage.getItem(storageKey)
      else
        return window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light'
    }

    const setPreference = () => {
      localStorage.setItem(storageKey, theme.value)
      reflectPreference()
    }

    const reflectPreference = () => {
      document.firstElementChild.setAttribute('data-theme', theme.value)
      document.querySelector('#theme-toggle')?.setAttribute('aria-label', theme.value)
    }

    const theme = {
      value: getColorPreference(),
    }

    reflectPreference()

    window.onload = () => {
      reflectPreference()
      document.querySelector('#theme-toggle').addEventListener('click', onClick)
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ({matches: isDark}) => {
      theme.value = isDark ? 'dark' : 'light'
      setPreference()
    })

    const chatContainer = document.getElementById('chatContainer');
    const queryInput = document.getElementById('queryInput');
    const spinner = document.getElementById('spinner');

    function submitQuery() {
      const query = queryInput.value.trim();
      if (!query) return;

      spinner.style.display = 'block';
      queryInput.disabled = true;
      queryInput.value = '';

      const userMessage = document.createElement('div');
      userMessage.className = 'chat-message user-message';
      userMessage.textContent = query;
      chatContainer.appendChild(userMessage);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `query=${encodeURIComponent(query)}`
      })
      .then(response => response.json())
      .then(data => {
        spinner.style.display = 'none';
        queryInput.disabled = false;

        const botMessage = document.createElement('div');
        botMessage.className = 'chat-message bot-message';
        botMessage.textContent = data.answer || 'No response.';
        chatContainer.appendChild(botMessage);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      })
      .catch(error => {
        spinner.style.display = 'none';
        queryInput.disabled = false;

        const botMessage = document.createElement('div');
        botMessage.className = 'chat-message bot-message';
        botMessage.textContent = `Error: ${error}`;
        chatContainer.appendChild(botMessage);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      });
    }
  </script>
</body>
</html>
